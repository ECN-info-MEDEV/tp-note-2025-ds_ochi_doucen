name: Build and Analyze with SonarCloud

on:
  push:
    branches:
      - master
      - tatsuya
      - mathieu
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write 

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      # 1. 
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 
      # 2.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu' 
      # 3. SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 4. Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 5. Build and analyze
      - name: Build and analyze with coverage
        working-directory: tp-note-2025-ds_ochi_doucen/src/main/java/fr/centrale/tp/note/ds_ochi_doucen/TpNote2025Ds_ochi_doucen.java 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ECN-info-MEDEV_tp-note-2025-ds_ochi_doucen \
            -Dsonar.organization=ecn-info-medev \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
